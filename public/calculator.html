<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512' fill='%231e3a8a'%3E%3Cpath d='M70.8-6.7c5.4-5.4 13.8-6.2 20.2-2L209.9 70.5c8.9 5.9 14.2 15.9 14.2 26.6l0 49.6 90.8 90.8c33.3-15 73.9-8.9 101.2 18.5L542.2 382.1c18.7 18.7 18.7 49.1 0 67.9l-60.1 60.1c-18.7 18.7-49.1 18.7-67.9 0L288.1 384c-27.4-27.4-33.5-67.9-18.5-101.2l-90.8-90.8-49.6 0c-10.7 0-20.7-5.3-26.6-14.2L23.4 58.9c-4.2-6.3-3.4-14.8 2-20.2L70.8-6.7zm145 303.5c-6.3 36.9 2.3 75.9 26.2 107.2l-94.9 95c-28.1 28.1-73.7 28.1-101.8 0s-28.1-73.7 0-101.8l135.4-135.5 35.2 35.1zM384.1 0c20.1 0 39.4 3.7 57.1 10.5 10 3.8 11.8 16.5 4.3 24.1L388.8 91.3c-3 3-4.7 7.1-4.7 11.3l0 41.4c0 8.8 7.2 16 16 16l41.4 0c4.2 0 8.3-1.7 11.3-4.7l56.7-56.7c7.6-7.5 20.3-5.7 24.1 4.3 6.8 17.7 10.5 37 10.5 57.1 0 43.2-17.2 82.3-45 111.1l-49.1-49.1c-33.1-33-78.5-45.7-121.1-38.4l-56.8-56.8 0-29.7-.2-5c-.8-12.4-4.4-24.3-10.5-34.9 29.4-35 73.4-57.2 122.7-57.3z'/%3E%3C/svg%3E" type="image/svg+xml">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free unit price calculator - compare supermarket prices per kg, 100g, liter and more.">
  <meta name="keywords" content="unit price calculator, price per kg, supermarket calculator, price comparison tool">
  <title>Unit Price Calculator | Koorevaar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/upcalc (2).png" type="image/png">
  <link rel="apple-touch-icon" href="/upcalc (2).png">
</head>
<body class="bg-gray-100 py-12">
  <div class="max-w-2xl mx-auto px-6">
    <h1 class="text-4xl font-bold text-center mb-2">Unit Price Calculator</h1>
    <p class="text-center text-gray-600 mb-10">Supermarket price per unit calculator</p>

    <div class="bg-white rounded-2xl shadow p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Total Price (€)</label>
          <input type="number" id="price" step="0.01" value="2.99" 
            class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-blue-500 text-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Weight / Quantity</label>
          <input type="number" id="weight" step="0.01" value="500" 
            class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-blue-500 text-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Discount (%)</label>
          <input type="number" id="discount" value="0" min="0" max="100" 
            class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-blue-500 text-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Unit</label>
          <select id="unit" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-blue-500 text-lg">
            <option value="1">per gram</option>
            <option value="100" selected>per 100g</option>
            <option value="1000">per kg</option>
            <option value="1000">per liter</option>
            <option value="1">per piece</option>
          </select>
        </div>
      </div>

      <button onclick="calculatePrice()" 
        class="mt-8 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-xl text-lg transition">
        Calculate Unit Price
      </button>

      <div id="result" class="mt-8 text-center min-h-[100px]"></div>
    </div>
  </div>

  <script>
    function calculatePrice() {
      const price = parseFloat(document.getElementById('price').value) || 0;
      const weight = parseFloat(document.getElementById('weight').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const unit = parseFloat(document.getElementById('unit').value);

      const resultDiv = document.getElementById('result');

      if (price <= 0 || weight <= 0) {
        resultDiv.innerHTML = '<p class="text-red-500">Please enter valid price and weight</p>';
        return;
      }

      let finalPrice = price * (1 - discount / 100);
      const pricePerUnit = (finalPrice / weight) * unit;

      resultDiv.innerHTML = "
        <div class="inline-block bg-green-50 border border-green-200 rounded-2xl px-12 py-8">
          <p class="text-sm text-gray-600">Price per unit</p>
          <p class="text-5xl font-bold text-green-700">€ \${pricePerUnit.toFixed(4)}</p>
        </div>
      ";

      fetch('/api/log-calculation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          price: price,
          weight: weight,
          discount: discount,
          unit: unit,
          final_price_per_unit: pricePerUnit
        })
      }).catch(() => {}); // Silent fail
    }

    // Allow Enter key
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') calculatePrice();
    });
  </script>
</body>
</html>
